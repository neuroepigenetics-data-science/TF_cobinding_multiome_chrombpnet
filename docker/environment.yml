# R environment for the Zamboni Track-A pipeline.
#
# Pinning policy: only the versions that MATTERED are pinned exactly; the rest
# are pinned by generation via r-base=4.3, which fixes Bioconductor 3.18 and so
# fixes GenomeInfoDb at 1.38.x (the version needing the Rprofile.site shim).
# The built image is the real lockfile -- this file only needs to solve once.
#
#   r-base 4.3      -> Bioc 3.18 -> GenomeInfoDb 1.38.1 (see Rprofile.site)
#   r-seurat 5.3.0  -> the object is a Seurat v5 object
#   r-signac 1.14.0 -> provides SplitFragments / ChromatinAssay
#
# harmony 0.1.1, DoubletFinder 2.0.6 and (optionally) ArchR 1.0.3 are NOT here:
# they are not on conda at the needed versions. See install_extras.R.
name: zamboni-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.3
  - r-seurat=5.3.0
  - r-signac=1.14.0
  # used directly by the pipeline scripts
  - r-matrix
  - r-dplyr
  - r-yaml
  - r-hdf5r
  # needed to build the non-conda packages
  - r-remotes
  - r-devtools
  - r-biocmanager
  # genome / motif references used by code/source.R and the R steps
  - bioconductor-biovizbase
  - bioconductor-ensdb.mmusculus.v79
  - bioconductor-bsgenome.mmusculus.ucsc.mm10
  - bioconductor-tfbstools
  - bioconductor-jaspar2020
  - bioconductor-scdblfinder
  - bioconductor-dropletutils
  # code/source.R library()s these unconditionally
  - bioconductor-tcseq
  - r-gprofiler2
  - r-upsetr
  - r-rvest
  - r-ggplot2
  - r-patchwork
  - r-rcolorbrewer
